name: New Grad Job Hunter
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify without Telegram messages
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: job-hunter-state
  cancel-in-progress: false
jobs:
  scan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests
        run: python -m pytest -q
      - name: Restore durable state branch
        shell: bash
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin bot-state; then
            git fetch origin bot-state:refs/remotes/origin/bot-state
            git show FETCH_HEAD:history.json > state/history.json
          fi
      - name: Scan official sources
        id: scan
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRADUATION_YEAR: ${{ vars.GRADUATION_YEAR }}
          ALERT_EXISTING: ${{ vars.ALERT_EXISTING }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          else
            test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID"
            python main.py
          fi
      - name: Persist state even on incomplete scans
        if: always()
        shell: bash
        run: |
          if [ ! -f state/history.json ]; then exit 0; fi
          git config user.name 'job-hunter[bot]'
          git config user.email 'job-hunter@users.noreply.github.com'
          git worktree add --detach /tmp/hunter-state
          cd /tmp/hunter-state
          if git show-ref --verify --quiet refs/remotes/origin/bot-state; then
            git checkout -B bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf .
          fi
          cp "$GITHUB_WORKSPACE/state/history.json" history.json
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist scan history'
            git push origin HEAD:bot-state
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-diagnostics
          path: diagnostics/
          retention-days: 7
      - name: Report incomplete scan
        if: steps.scan.outcome == 'failure'
        run: exit 1
